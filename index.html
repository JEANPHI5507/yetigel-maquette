<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yetigel ADV — Maquette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout : outil de bureau dense. Bandeau encre + barre d'espaces, puis contenu en tableaux pleine largeur
   séparés par des filets. Pas de cartes sauf ce qui se superpose (panneau de saisie, recherche).
   Un seul élément fort : la liste de travail de Mon poste, rangée par échéance, framboise pour l'urgent. */
:root{
  --paper:#f5f7f8; --sheet:#ffffff; --rule:#d5dde3; --rule-soft:#e7ecef;
  --text:#16232f; --muted:#56687a; --faint:#8696a5;
  --ink:#17324d; --ink-2:#22466a; --berry:#c2185b; --berry-ink:#ffffff;
  --ok:#1f7a4d; --late:#b3261e; --wait:#9a6400; --info:#2b5f8f;
  --bg:var(--paper); --surface:var(--sheet); --elev:#eef2f4; --border:var(--rule); --fg:var(--text);
  --accent:var(--berry); --accent-ink:var(--berry-ink); --accent-soft:rgba(194,24,91,.08);
  --ink-soft:rgba(23,50,77,.07); --bar:var(--ink);
  --pos:var(--ok); --neg:var(--late); --warn:var(--wait);
  --pos-soft:rgba(31,122,77,.10); --neg-soft:rgba(179,38,30,.09); --warn-soft:rgba(154,100,0,.10);
  --shadow:0 18px 40px rgba(22,35,47,.18);
  --f:"Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f171f; --sheet:#141e28; --rule:#2a3846; --rule-soft:#1f2b37;
    --text:#e2e9ef; --muted:#9aabba; --faint:#6f8294;
    --ink:#0a1219; --ink-2:#9cc0e0; --berry:#f06292; --berry-ink:#1b0710;
    --ok:#5cc98f; --late:#ff8a80; --wait:#e8b84a; --info:#8bb8e0;
    --elev:#1a2632; --accent-soft:rgba(240,98,146,.12); --ink-soft:rgba(156,192,224,.10);
    --pos-soft:rgba(92,201,143,.12); --neg-soft:rgba(255,138,128,.12); --warn-soft:rgba(232,184,74,.12);
    --shadow:0 18px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f171f; --sheet:#141e28; --rule:#2a3846; --rule-soft:#1f2b37;
  --text:#e2e9ef; --muted:#9aabba; --faint:#6f8294;
  --ink:#0a1219; --ink-2:#9cc0e0; --berry:#f06292; --berry-ink:#1b0710;
  --ok:#5cc98f; --late:#ff8a80; --wait:#e8b84a; --info:#8bb8e0;
  --elev:#1a2632; --accent-soft:rgba(240,98,146,.12); --ink-soft:rgba(156,192,224,.10);
  --pos-soft:rgba(92,201,143,.12); --neg-soft:rgba(255,138,128,.12); --warn-soft:rgba(232,184,74,.12);
  --shadow:0 18px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px;border-radius:3px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.ref{font-family:var(--f-mono);font-size:12.5px;letter-spacing:0}
.code{font-size:12.5px;color:var(--muted)}

/* ── Coquille ── */
.app{display:flex;flex-direction:column;min-height:100%}
.main{display:contents}
.top{order:-2;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top::before{content:"Yetigel";font-weight:800;font-stretch:80%;font-size:19px;letter-spacing:-.01em;margin-right:6px}
.burger{display:none}
.search{flex:1 1 300px;min-width:0;position:relative;max-width:540px}
.search input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:7px 10px 7px 32px;color:#fff;font:inherit}
.search input::placeholder{color:rgba(255,255,255,.62)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.7)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px var(--f);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.25);border-radius:3px;padding:0 5px}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sheet);color:var(--text);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:4px;max-height:360px;overflow:auto;z-index:50}
.results button{display:grid;grid-template-columns:78px 1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:3px;align-items:center}
.results button:hover,.results button.sel{background:var(--elev)}
.results .kind{font-size:12px;color:var(--muted)}
.results .empty{padding:10px;color:var(--muted);font-size:13px}
.role{display:flex;align-items:center;gap:8px;margin-left:auto}
.role label{font-size:13px;color:rgba(255,255,255,.75)}
select{background:var(--sheet);color:var(--text);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;font:inherit}
.top select{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.top select option{color:#16232f;background:#fff}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:4px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.iconbtn.on{background:#fff;color:#17324d;border-color:#fff}
.iconbtn svg{display:none}
.mock{font-size:12px;color:#ffd6e5;white-space:nowrap}

.side{order:-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--sheet);border-bottom:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand,.side-foot,.nav-label{display:none}
.nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:7px;padding:11px 13px 9px;color:var(--muted);text-decoration:none;white-space:nowrap;font-size:14px;font-weight:500;border-bottom:2px solid transparent}
.nav a:hover{color:var(--text)}
.nav a.on{color:var(--text);font-weight:700;border-bottom-color:var(--text)}
.nav a svg{display:none}
.nav a small{display:none}
.nav .cnt{font-size:12px;font-weight:700;color:var(--muted)}
.nav .cnt.hot{color:var(--berry)}

.page{padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1240px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:4px}
.eyebrow{display:none}
.head h1{font-weight:800;font-stretch:72%;font-size:clamp(30px,3.4vw,40px);line-height:1;letter-spacing:-.01em;color:var(--text)}
.head p{margin:8px 0 0;color:var(--muted);max-width:72ch}

/* Notes de maquette (masquées par défaut) */
.why{border-left:3px solid var(--berry);background:var(--accent-soft);padding:2px 0}
.why summary{cursor:pointer;padding:8px 14px;font-size:13px;font-weight:600;list-style:none}
.why summary::-webkit-details-marker{display:none}
.why ul{margin:0;padding:0 18px 10px 32px;color:var(--text);font-size:13px;display:grid;gap:4px}

/* Onglets : soulignés, sobres */
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--rule)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 12px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);font-weight:700;border-bottom-color:var(--berry)}
.restricted{font-size:11px;color:var(--faint);margin-left:5px;font-weight:400}
.subtabs{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.subtabs button{background:none;border:0;padding:2px 0;color:var(--muted);border-bottom:1px solid transparent}
.subtabs button.on{color:var(--text);font-weight:700;border-bottom-color:var(--text)}

.grid{display:grid;gap:20px 28px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}

/* Sections : un titre et un filet, pas de carte */
.panel{min-width:0;border-top:1px solid var(--text);padding-top:10px}
.panel h2{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.panel h2 .link,.link{font-size:13px;font-weight:600;color:var(--berry);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}

/* Chiffres : bandeau discret ; tuiles seulement sur Direction (.tiles) */
.grid:has(> .kpi){display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpi{display:flex;flex-direction:column;gap:2px;padding:10px 22px 10px 0;margin-right:22px;border-right:1px solid var(--rule-soft);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;line-height:1.2}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi .bar{margin-top:4px}
.tiles .grid:has(> .kpi){border:0;gap:0}
.tiles .kpi{padding:14px 28px 14px 0;margin-right:28px}
.tiles .kpi .v{font-size:34px;font-weight:800;font-stretch:75%}
.up{color:var(--ok)} .down{color:var(--late)}

/* Statuts : carré de couleur + texte, sans fond */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:1px;background:var(--c,var(--faint));flex:none}
.chip.pos{--c:var(--ok)} .chip.neg{--c:var(--late)} .chip.warn{--c:var(--wait)} .chip.info{--c:var(--info)} .chip.mute{--c:var(--rule);color:var(--muted)}
.due{color:var(--late);font-weight:700;white-space:nowrap}
.locked{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}

/* Tableaux */
.tbl{overflow-x:auto;background:var(--sheet);border-top:1px solid var(--text);border-bottom:1px solid var(--rule)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--sheet)}
td{padding:9px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--elev)}
td.r,th.r{text-align:right}
td button[data-ens],td button[data-art]{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.bar{height:5px;background:var(--rule-soft);overflow:hidden;min-width:70px;border-radius:0}
.bar i{display:block;height:100%;background:var(--ink-2)}
.bar i.w{background:var(--wait)} .bar i.c{background:var(--late)} .bar i.p{background:var(--ok)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:4px 10px;font-size:13px;color:var(--text)}
.fchip.on{background:var(--text);border-color:var(--text);color:var(--sheet)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{background:var(--sheet);border:0;border-right:1px solid var(--rule);padding:5px 12px;font-size:13px;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--text);color:var(--sheet)}

/* Boutons */
.btn{background:var(--berry);color:var(--berry-ink);border:1px solid var(--berry);border-radius:4px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--sheet);color:var(--text);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--text)}
.btn:disabled{opacity:.55;cursor:progress}

/* Mon poste : liste de travail par échéance */
.worklist{display:flex;flex-direction:column}
.wgroup{display:flex;align-items:baseline;gap:12px;font-weight:700;font-size:14px;padding:16px 0 6px;border-bottom:1px solid var(--text)}
.wgroup span{font-weight:400;color:var(--muted);font-size:13px}
.wgroup.now{color:var(--berry);border-bottom-color:var(--berry)}
.witem{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.witem .m{width:8px;height:8px;border-radius:1px;background:var(--faint)}
.witem.crit .m{background:var(--berry)} .witem.warn .m{background:var(--wait)} .witem.ok .m{background:var(--info)}
.witem .t{font-weight:600}
.witem .s{font-size:13px;color:var(--muted)}
.shortcuts{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);align-items:baseline}
.shortcuts button{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.shortcuts button:hover{text-decoration-color:var(--text)}

/* Fiche 360 */
.ident{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.mono{display:none}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.ident h2{font-weight:800!important;font-stretch:72%;font-size:36px!important;line-height:1.05;color:var(--text)}
.cascade{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));border-top:1px solid var(--text);border-bottom:1px solid var(--rule)}
.step{padding:9px 10px;border-right:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:2px}
.step:last-child{border-right:0}
.step .l{font-size:12.5px;color:var(--muted)}
.step .v{font-size:16px;font-weight:600}
.step.total{background:var(--elev)} .step.total .v{font-weight:800}
.note{font-size:13px;color:var(--muted);margin:8px 0 0;max-width:80ch}

/* Finance : colonnes */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:24px;overflow-x:auto;padding-bottom:4px}
.lane{display:flex;flex-direction:column;min-width:0;border-top:1px solid var(--text)}
.lane h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;padding:9px 0}
.lane h3 button{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.card{border-top:1px solid var(--rule-soft);padding:9px 0;display:flex;flex-direction:column;gap:3px}
.card .a{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.card .b{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}

/* Présences, planning */
.week,.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--text);border-bottom:1px solid var(--rule)}
.day{padding:10px;display:flex;flex-direction:column;gap:5px;min-height:84px;border-right:1px solid var(--rule-soft);background:var(--sheet)}
.day:last-child{border-right:0}
.day .dn{font-size:12.5px;color:var(--muted)}
.day.today .dn{color:var(--berry);font-weight:700}
button.day{cursor:pointer;color:inherit;font:inherit;text-align:left;border:0;border-right:1px solid var(--rule-soft)}
button.day:hover{background:var(--elev)}
.cal .day{min-height:120px}
.visit{font-size:12.5px;padding:3px 0 3px 8px;border-left:2px solid var(--ink-2)}
.visit.late{border-left-color:var(--late)} .visit.done{border-left-color:var(--ok);color:var(--muted)}

/* Terminal inventaire */
.phone{width:min(240px,100%);aspect-ratio:9/16;max-width:100%;border-radius:18px;background:#17324d;color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:10px;margin-inline:auto}
.phone .code{color:rgba(255,255,255,.72)}
.phone .scan{border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:12px 10px;text-align:center;color:#fff;font-size:13px}
.phone .big{font-size:34px;font-weight:800;font-stretch:75%;text-align:center}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

/* Modules, fiches */
.feats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px}
.feats span::before{content:"– ";color:var(--faint)}
.from{font-size:12.5px;color:var(--muted);margin-top:10px}
.from b{font-weight:600;color:var(--text)}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.dim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--text)}
.dim div{padding:8px 10px;border-right:1px solid var(--rule-soft)}
.dim div:last-child{border-right:0}
.dim .l{font-size:12.5px;color:var(--muted)} .dim .v{font-weight:600}
.fate{font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.fate::before{content:"";width:8px;height:8px;border-radius:1px;background:var(--faint)}
.fate.keep::before{background:var(--ok)} .fate.merge::before{background:var(--ink-2)} .fate.tab::before{background:var(--info)} .fate.jp::before{background:var(--wait)} .fate.arch{color:var(--muted)} .fate.arch::before{background:var(--rule)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form input,.form select{background:var(--sheet);color:var(--text);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;font:inherit;min-width:0}

/* Faisabilité */
.fdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}
.fdot.ok{background:var(--ok)} .fdot.adapt{background:var(--info)} .fdot.new{background:var(--berry)} .fdot.perf{background:var(--wait)} .fdot.decide{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.feas{display:inline-flex;align-items:center;font-size:13px;white-space:nowrap}
.feasbar{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:10px 14px;font-size:13px;background:var(--sheet);border:1px solid var(--rule);border-left-width:3px}
.feasbar.ok{border-left-color:var(--ok)} .feasbar.adapt{border-left-color:var(--info)} .feasbar.new{border-left-color:var(--berry)} .feasbar.perf{border-left-color:var(--wait)} .feasbar.decide{border-left-color:var(--muted)}
.feasbar .feas{font-weight:700}
.feasbar > span:last-child{flex:1 1 320px;min-width:0}

/* Panneau de saisie */
.scrim{position:fixed;inset:0;background:rgba(15,23,31,.4);z-index:45}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:46;background:var(--sheet);color:var(--text);box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--rule);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.drawer header h2{font-size:22px;font-weight:800;font-stretch:75%;line-height:1.1}
.iconbtn2{background:none;border:1px solid var(--rule);border-radius:4px;width:30px;height:30px;color:var(--text)}
.dbody{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.drawer footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--rule);flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{background:var(--sheet);color:var(--text);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font:inherit;font-weight:400;font-size:13.5px;min-width:0;width:100%}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--text);outline:none}
.fld textarea{resize:vertical;line-height:1.5}
.pick{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px;cursor:pointer}
.pick input{margin-top:3px;accent-color:var(--berry)}
.mailprev{padding:12px 14px;font-size:13.5px;line-height:1.6;border:1px solid var(--rule);background:var(--paper)}
.errline{font-size:13px;color:var(--late);margin-top:6px}
.errline::before{content:"Échec : ";font-weight:700}
.steps{display:flex;gap:0;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
.steps span{white-space:nowrap}
.steps span + span::before{content:" / ";color:var(--rule);padding:0 4px}
.steps span.done{color:var(--ok)} .steps span.now{color:var(--text);font-weight:700}
.dirtybar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--wait);border-left-width:3px;padding:8px 12px;font-size:13.5px;font-weight:600;position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:15}

.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;
  background:#17324d;color:#fff;border-radius:4px;padding:10px 14px;box-shadow:var(--shadow);font-size:13.5px;max-width:min(380px,calc(100vw - 32px))}

@media (max-width:1100px){ .split{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){ .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)} .search kbd{display:none} .role label{display:none} .dim{grid-template-columns:repeat(2,minmax(0,1fr))}
  .week,.cal{grid-template-columns:repeat(2,minmax(0,1fr))} .day{border-bottom:1px solid var(--rule-soft)} }
@media (max-width:520px){ .mock{display:none} .top::before{display:none} .kpi{padding-right:14px;margin-right:14px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

const st = { role:'adv', tab:{}, sub:{}, cur:{}, ens:'hno', level:'enseigne', fam:'Toutes', stockView:'simple', art:'POT5FRA', planF:'all', feas:false, notes:false, drawer:null, dirty:false };
const val = x => typeof x.n === 'function' ? x.n() : x.n;
try { const r = localStorage.getItem('yt-maquette-role'); if (r && ROLES[r]) st.role = r; } catch(e){}
const eur = v => v.toLocaleString('fr-FR',{maximumFractionDigits:0}) + ' €';
const keur = v => (v/1000).toLocaleString('fr-FR',{maximumFractionDigits:0}) + ' k€';
const pct = v => v.toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' %';
const kg = v => v.toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' kg';
const evo = (a,b) => { const d=(a-b)/b*100; return `<span class="${d>=0?'up':'down'}">${d>=0?'+':''}${d.toLocaleString('fr-FR',{maximumFractionDigits:1})} %</span>`; };
const ensById = id => ENSEIGNES.find(e=>e.id===id);
const artBy = c => ARTICLES.find(a=>a.code===c);
const isJP = () => st.role === 'admin';
const canWrite = k => (WRITERS[k]||[]).includes(st.role);
const ro = () => st.role === 'direction';

function route(){ const h=(location.hash||'').slice(1); const R=ROLES[st.role]; return R.spaces.includes(h)?h:R.home; }
function go(space, tab){ if (tab) st.tab[space]=tab; if (location.hash.slice(1)===space) render(); else location.hash=space; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }

function visibleTabs(space){ return (TABS[space]||[]).filter(([k,l,r]) => r!=='jp' || isJP()).filter(([k,l,r]) => r!=='off' || isJP()); }
function tabBar(space){
  const list = visibleTabs(space); if (!list.length) return {cur:null, html:''};
  let cur = st.tab[space]; if (!list.some(t=>t[0]===cur)) cur = list[0][0];
  st.cur[space] = cur;
  const dot = k => { const f = FEAS[space+':'+k]; return st.feas && f ? `<i class="fdot ${f[0]}" title=""></i>` : ''; };
  return {cur, html:`<div class="tabs" role="tablist">${list.map(([k,l,r])=>`<button role="tab" aria-selected="${k===cur}" class="${k===cur?'on':''}" data-tab="${space}:${k}">${dot(k)}${l}${r==='jp'?'<span class="restricted">JP</span>':r==='off'?'<span class="restricted">masqué</span>':''}</button>`).join('')}</div>`};
}
function subBar(key, list){
  let cur = st.sub[key]; if (!list.some(t=>t[0]===cur)) cur = list[0][0];
  return {cur, html:`<div class="subtabs">${list.map(([k,l])=>`<button class="${k===cur?'on':''}" data-sub="${key}:${k}">${l}</button>`).join('')}</div>`};
}
function head(eyebrow, title, sub, right=''){ return `<div class="head"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`; }
function why(items){ if (!st.notes) return ''; return `<details class="why" open><summary>Ce qui change par rapport à l’app actuelle</summary><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></details>`; }
function mod(key){
  const m = MODS[key]; if (!m) return '';
  return `<section class="panel"><h2>${m.t}</h2><p class="note" style="margin:0">${m.d}</p><div class="feats">${m.f.map(x=>`<span>${x}</span>`).join('')}</div><div class="from"><b>Vient de :</b> ${m.from}</div></section>`;
}
function todoList(list){
  list = list.filter(x=>val(x)>0);
  if (!list.length) return `<p class="note" style="margin:0">Tout est traité. Rien ne vous attend pour l’instant.</p>`;
  return `<div class="todo">${list.map(x=>`<button data-go="${x.go}" data-gotab="${x.tab||''}"><span class="sev ${x.sev}"></span><span class="n num">${val(x)}</span><span><div class="t">${x.t}</div><div class="s">${x.s}</div></span><span class="go">Ouvrir</span></button>`).join('')}</div>`; }
function table(cols, rows){ return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th class="${c.startsWith('>')?'r':''}">${c.replace(/^>/,'')}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${cols[i].startsWith('>')?'r num':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
function barChart(n, p, labels){
  const W=640,H=210,padL=40,padB=26,padT=10, max=Math.ceil(Math.max(...n,...p)/50)*50, cw=(W-padL-10)/n.length, bw=Math.min(14,cw/3), y=v=>padT+(H-padT-padB)*(1-v/max);
  let g=''; for(let t=0;t<=max;t+=max/4){ g+=`<line x1="${padL}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)"/><text x="${padL-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--faint)">${Math.round(t)}</text>`; }
  n.forEach((v,i)=>{ const x=padL+i*cw+cw/2;
    g+=`<rect x="${x-bw-1}" y="${y(p[i])}" width="${bw}" height="${y(0)-y(p[i])}" rx="0" fill="var(--border)"/><rect x="${x+1}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="0" fill="var(--ink-2)"/><text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${labels[i]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="CA mensuel N et N-1 en k€">${g}</svg><div class="legend"><span><i style="background:var(--ink-2)"></i>2026 (k€)</span><span><i style="background:var(--border)"></i>2025 (k€)</span></div>`;
}
const chipStatut = s => `<span class="chip ${s==='Livrée'||s==='Validé'||s==='Signé'?'pos':s==='Expédiée'||s==='Confirmée'?'info':s==='Incomplet'?'neg':'warn'}">${s}</span>`;

function vAccueil(){
  const R=ROLES[st.role], list=(TODO[st.role]||[]).filter(x=>val(x)>0);
  const groups=[['crit','Aujourd’hui','à traiter avant ce soir'],['warn','Cette semaine',''],['ok','Plus tard','']];
  const total=list.reduce((a,x)=>a+val(x),0);
  const phrase=x=>{ const n=val(x), t=x.t.charAt(0).toLowerCase()+x.t.slice(1); return `${n} ${t}`; };

  const short = {

    compta:[['finance','bv','Factures BV'],['finance','nip','Factures NIP'],['finance','relances','Relances']],
    qualite:[['produits','validation','Articles à valider'],['produits','ft','Fiches techniques'],['produits','ingredients','Ingrédients']],
    logistique:[['logistique','stock','Stock'],['logistique','mouvements','Mouvements de palettes'],['logistique','inventaire','Inventaire dépôt']],
    rh:[['rh','salaries','Salariés'],['rh','conges','Congés'],['rh','bp','Bulletins']],

  return head('', 'Mon poste', total ? `${total} éléments à traiter pour le rôle ${R.label}.` : `Rien à traiter pour le rôle ${R.label}.`) +
    why(['Aucune page d’accueil métier aujourd’hui : chaque rôle arrive sur la première page autorisée (souvent Ventes CA).',
         'Les compteurs existent déjà mais sont dispersés : articles en attente, factures NIP à traiter, alertes DLC, relances sans email, visites en retard.',
         'La liste est rangée par échéance. Le compteur dans la barre d’espaces reprend ces tâches, en framboise quand l’une d’elles est pour aujourd’hui.',
         'Vous cherchez une page de l’ancienne app ? L’espace « Plan de l’app » indique où chacune se trouve maintenant.']) +
    (rows ? `<section class="worklist" aria-label="À traiter">${rows}</section>` : `<p class="note" style="margin:0">Tout est traité. Les nouvelles tâches apparaîtront ici.</p>`) +
    (short.length ? `<div class="shortcuts"><span>Accès directs :</span>${short.map(([g,t,l])=>`<button data-go="${g}" data-gotab="${t}">${l}</button>`).join('')}</div>` : '');
}

function cascade(a){
  const net2=a.r1+a.r2+a.r3, net3=net2+a.coop, net4=net3+a.promo, net5=net4+a.frais+(isJP()?a.rfa:0);
  const rfa = isJP()?`<div class="v num">${pct(a.rfa)}</div>`:`<div class="v"><span class="locked">${LOCK} Réservé</span></div>`;
  const s=(l,v,t)=>`<div class="step ${t?'total':''}"><div class="l">${l}</div><div class="v num">${pct(v)}</div></div>`;
  return `<div class="cascade">${s('R1 CGV',a.r1)}${s('R2 CPV',a.r2)}${s('R3 Autres',a.r3)}${s('2NET',net2)}${s('COOP',a.coop)}${s('3NET',net3,1)}<div class="step"><div class="l">RFA à date</div>${rfa}</div>${s('4NET',net4)}${s('5NET',net5,1)}</div>
    <p class="note">${isJP()?'La RFA est visible pour votre compte et entre dans le 5NET.':'La RFA reste réservée. Elle s’affiche « Réservé » au lieu d’un « — » qui laissait croire à une absence de RFA, et sans message d’erreur.'}</p>`;
}

    table(['Lot','Contenu','Détail','Ce qui est touché','Taille','Décision nécessaire'], LOTS.map(l=>[`<span class="num">${l[0]}</span>`,`<b>${l[1]}</b>`,l[2],`<span class="code">${l[3]}</span>`,l[4],l[5]==='Aucune'?'<span class="chip pos">aucune</span>':`<span class="chip warn">${l[5]}</span>`])) +
    `<p class="note">Le lot 1 est la clé : il donne la nouvelle organisation sans réécrire les pages, qui sont chargées telles quelles dans les onglets. Les lots suivants améliorent chaque espace l’un après l’autre.</p>`;
  return vPlanPages(t.html);
}
function vPlanPages(tabsHtml){
  const f=st.planF, rows=PLAN.filter(p=>f==='all'||p[4]===f);
  const cnt=k=>PLAN.filter(p=>p[4]===k).length;
  const fbtn=(k,l)=>`<button class="fchip ${f===k?'on':''}" data-plan="${k}">${l}${k!=='all'?` (${cnt(k)})`:` (${PLAN.length})`}</button>`;
  return head('Plan de l’app', 'Où est passée chaque page ?', `Les ${PLAN.length} pages de l’app actuelle et leur place dans la nouvelle organisation. La colonne « Utilisateurs » est réelle (audit du 17/11, 60 derniers jours).`) + tabsHtml +
    `<div class="filters">${fbtn('all','Toutes')}${fbtn('keep','Gardées')}${fbtn('tab','Deviennent un onglet')}${fbtn('merge','Fusionnées')}${fbtn('jp','Réservées JP')}${fbtn('arch','À archiver')}</div>` +
    table(['Page actuelle','Fichier','Nouvel emplacement','Sort','Faisabilité','>Utilisateurs 60 j'], rows.map(([file,lbl,sp,tab,fate,u])=>{
      const tabLbl = tab ? ((TABS[sp]||[]).find(x=>x[0]===tab)||[,''])[1] : '';
      const can = ROLES[st.role].spaces.includes(sp);
      const dest = `${SPACES[sp].label}${tabLbl?' › '+tabLbl:''}`;
      const fz = FEAS[sp+':'+tab] || FEAS[sp];
      return [lbl,`<span class="ref">${file}.html</span>`, can&&fate!=='arch'?`<button data-go="${sp}" data-gotab="${tab}" style="background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-align:left">${dest}</button>`:dest, `<span class="fate ${FATE[fate][0]}">${FATE[fate][1]}</span>`, fate==='arch'?'—':fz?`<span class="feas ${fz[0]}"><i class="fdot ${fz[0]}"></i>${FEAS_LBL[fz[0]]}</span>`:'—', u];
    })) + `<p class="note">« À archiver » : pages masquées, bloquées ou sans point d’entrée. À confirmer une par une avant suppression.</p>`;
}

const VIEWS = {accueil:vAccueil, clients:vClients, ventes:vVentes, produits:vProduits, projets:vProjets, logistique:vLogistique, finance:vFinance, terrain:vTerrain, documents:vDocuments, direction:vDirection, rh:vRH, moi:vMoi, admin:vAdmin, plan:vPlan};

function feasBanner(cur){
  if (!st.feas) return '';
  const f = FEAS[cur+':'+(st.cur[cur]||'')] || FEAS[cur];
  if (!f) return '';
  return `<div class="feasbar ${f[0]}"><span class="feas ${f[0]}"><i class="fdot ${f[0]}"></i>${FEAS_LBL[f[0]]}</span><span>${f[1]}</span></div>`;
}
let _lastView = '';
function render(){
  const cur=route(); renderNav(cur);
  const viewKey = cur + ':' + (st.tab[cur]||'');
  const html = VIEWS[cur]();
  const page = document.getElementById('page');
  page.innerHTML = feasBanner(cur) + html;
  const es=document.getElementById('ensSel'); if (es) es.addEventListener('change', e=>{ st.ens=e.target.value; render(); });
  const as=document.getElementById('artSel'); if (as) as.addEventListener('change', e=>{ st.art=e.target.value; st.dirty=false; render(); });
  const den=document.getElementById('artDenom'); if (den) den.addEventListener('input', ()=>{ if (!st.dirty){ st.dirty=true; st._denom=den.value; render(); const d2=document.getElementById('artDenom'); d2.value=st._denom; d2.focus(); } else st._denom=den.value; });
  const mf=document.getElementById('mvtForm'); if (mf) mf.addEventListener('submit', e=>{ e.preventDefault();
    const nb=parseInt(document.getElementById('mvtNb').value,10), ref=document.getElementById('mvtRef').value.trim();
    if (!nb || nb<1){ toast('Indiquez un nombre de palettes supérieur à zéro.'); return; }
    if (!ref){ toast('Indiquez la référence du BL ou de la réception.'); return; }
    MVT.unshift({date:'17/11', type:document.getElementById('mvtType').value, stk:document.getElementById('mvtStk').value, nb, ref});
    toast('Mouvement enregistré : '+nb+' palettes, '+ref+'.'); render(); });
  const sf=document.getElementById('scanForm'); if (sf){ const si=document.getElementById('scanIn'); si.focus();
    sf.addEventListener('submit', e=>{ e.preventDefault(); const code=si.value.replace(/\s/g,'');
      if (!/^\d{18}$/.test(code)){ SCANS.push({sscc:code||'(vide)', empl:'C-'+(12+SCANS.length), art:'—', ok:false, msg:'SSCC invalide : 18 chiffres attendus'}); toast('Scan refusé : un SSCC fait 18 chiffres.'); }
      else if (SCANS.some(s=>s.sscc===code && s.ok)){ SCANS.push({sscc:code, empl:'C-'+(12+SCANS.length), art:'—', ok:false, msg:'déjà scannée en '+SCANS.find(s=>s.sscc===code).empl}); toast('Palette déjà scannée : vérifiez l’emplacement.'); }
      else { const a=ARTICLES[SCANS.length % ARTICLES.length]; SCANS.push({sscc:code, empl:'C-'+(12+SCANS.length), art:a.nom, ok:true}); }
      render(); }); }
  if (_lastView !== viewKey) window.scrollTo({top:0});
  _lastView = viewKey;
  renderDrawer();
}

/* ═════════ Panneau latéral : les saisies ═════════ */
function renderDrawer(){
  let el=document.getElementById('drawer');
  if (!el){ el=document.createElement('div'); el.id='drawer'; document.body.appendChild(el); }
  const d=st.drawer; if (!d){ el.innerHTML=''; return; }
  let title='', body='', foot='';
  if (d.kind==='pen'){ const p=PEN.find(x=>x.id===d.id), e=ensById(p.ens);
    title=`Contester, ${e.nom}`;
    body=`<dl class="kv"><dt>Motif</dt><dd>${p.motif}</dd><dt>Montant</dt><dd class="num">${eur(p.montant)}</dd><dt>Délai</dt><dd>avant le ${p.ech} (J-${p.j})</dd></dl>
      <label class="fld">Motif de contestation<select id="penMotif"><option>Livraison conforme au bon de commande</option><option>Retard imputable à l’enseigne (quai)</option><option>Commande passée hors délai</option><option>Autre</option></select></label>
      <label class="fld">Pièces jointes (POD, BL signé)<input id="penFiles" type="file" multiple></label>
      <label class="fld">Mail de contestation<textarea id="penMail" rows="7">Bonjour,\n\nNous contestons la pénalité « ${p.motif} » de ${eur(p.montant)} reçue le ${p.recu}. Vous trouverez ci-joint les justificatifs.\n\nCordialement,\nService ADV Yetigel</textarea></label>`;
    foot=`<button class="btn ghost" data-act="close">Annuler</button><button class="btn" data-act="pen-send:${p.id}">Envoyer la contestation</button>`; }
  else if (d.kind==='rel'){ const r=REL.find(x=>x.id===d.id);
    title=`Relance, ${r.client}`;
    if (!r.email){ body=`<p class="note" style="margin:0">Aucune adresse de facturation connue pour ce client. Elle sera enregistrée pour les prochaines relances.</p><label class="fld">Email de facturation<input id="relEmail" type="email" placeholder="compta@client.example" autocomplete="off"></label>`;
      foot=`<button class="btn ghost" data-act="close">Annuler</button><button class="btn" data-act="rel-email:${r.id}">Enregistrer l’email</button>`; }
    else { body=`${r.etat==='echec'?'<div class="errline">Envoi du 03/11 échoué : le serveur de messagerie n’a pas répondu (502). Rien n’a été envoyé au client.</div>':''}
      <dl class="kv"><dt>Destinataire</dt><dd class="code">${r.email}</dd><dt>Montant dû</dt><dd class="num">${eur(r.montant)}</dd><dt>Pièce jointe</dt><dd>Relevé des factures non réglées (PDF)</dd></dl>
      <div class="mailprev"><b>Objet : Relevé de factures non réglées</b><br><br>Bonjour,<br>Sauf erreur de notre part, les factures ci-jointes restent impayées pour un total de ${eur(r.montant)}. Merci de nous indiquer la date de règlement prévue.<br><br>Service comptabilité Yetigel</div>
      <p class="note">C’est un vrai mail, envoyé au client.</p>`;
      foot=`<button class="btn ghost" data-act="close">Annuler</button><button class="btn" data-act="rel-send:${r.id}">Envoyer au client</button>`; } }
  else if (d.kind==='ao'){ const a=AOS.find(x=>x.id===d.id);
    title=`Rattacher des commandes, ${a.nom}`;
    const sugg=AO_SUGG.filter(c=>!a.cmds.includes(c.num));
    body=`<p class="note" style="margin:0">Commandes PrismaSoft proposées pour ${ensById(a.ens).nom}, période ${a.periode}.</p>
      ${sugg.length?sugg.map(c=>`<label class="pick"><input type="checkbox" value="${c.num}" ${c.ens===a.ens?'checked':''}><span><b class="num">${c.num}</b>, ${ensById(c.ens).nom}, ${c.date}, <span class="num">${eur(c.montant)}</span><br><span class="code">${c.why}</span></span></label>`).join(''):'<p class="note">Aucune autre commande à proposer.</p>'}
      <label class="fld">Ou chercher par n° de commande / réf. client<input id="aoSearch" placeholder="CMD-26-…"></label>
      <div class="from"><b>Déjà rattachées :</b> ${a.cmds.join(', ')||'aucune'}</div>`;
    foot=`<button class="btn ghost" data-act="close">Annuler</button><button class="btn" data-act="ao-add:${a.id}">Rattacher la sélection</button>`; }
  else if (d.kind==='note'){ const e=ensById(st.ens);
    title=`Note de négociation, ${e.nom}`;
    body=`<label class="fld">Ce qui s’est dit<textarea id="noteTxt" rows="6" placeholder="Ex. : l’acheteur accepte la tête de gondole S51 si la COOP passe à 3 %."></textarea></label><label class="fld">Prochaine action (facultatif)<input id="noteNext" placeholder="Ex. : envoyer la proposition avant le 26/11"></label>`;
    foot=`<button class="btn ghost" data-act="close">Annuler</button><button class="btn" data-act="note-save">Enregistrer la note</button>`; }
  el.innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${title.replace(/"/g,'')}"><header><h2>${title}</h2><button class="iconbtn2" data-act="close" aria-label="Fermer">✕</button></header><div class="dbody">${body}</div><footer>${foot}</footer></aside>`;
}

function act(cmd){
  const [k,arg]=cmd.split(':'); const id=isNaN(+arg)?arg:+arg;
  const close=()=>{ st.drawer=null; };
  switch(k){
    case 'close': close(); break;
    case 'pen': st.drawer={kind:'pen', id}; break;
    case 'pen-send': { const p=PEN.find(x=>x.id===id); p.statut='Contestée, en attente'; p.j=null; p.ech='réponse attendue'; close(); toast('Contestation envoyée. Elle reste suivie dans la liste jusqu’à la réponse de l’enseigne.'); break; }
    case 'rel': st.drawer={kind:'rel', id}; break;
    case 'rel-email': { const v=(document.getElementById('relEmail')||{}).value||''; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast('Adresse email invalide : vérifiez la saisie.'); return; }
      const r=REL.find(x=>x.id===id); r.email=v; r.etat='prete'; toast('Email enregistré. La relance est prête : prévisualisez-la avant envoi.'); break; }
    case 'rel-send': { const r=REL.find(x=>x.id===id); r.etat='envoyee'; close(); toast('Relance envoyée à '+r.email+'.'); break; }
    case 'bv': { const x=BVF.find(b=>b.no===arg); if (x.busy) return; x.busy=true; x.err=''; render();
      setTimeout(()=>{ x.busy=false;
        if (x.etape==='deposer' && x.failOnce){ x.failOnce=false; x.err='Dépôt refusé (422) : GLN du destinataire absent sur la fiche client. Corriger la fiche puis réessayer.'; toast('Dépôt FTP refusé : le motif est affiché sous la facture.'); }
        else { const i=BV_STEPS.findIndex(s=>s[0]===x.etape); x.etape=BV_STEPS[i+1][0]; toast(x.no+' : '+BV_STEPS[i][1].toLowerCase()+' fait.');
          if (x.etape==='attente') setTimeout(()=>{ x.etape='integree'; toast(x.no+' intégrée dans PrismaSoft.'); render(); }, 2500); }
        render(); }, 900); return; }
    case 'ao': st.drawer={kind:'ao', id}; break;
    case 'ao-add': { const a=AOS.find(x=>x.id===id); const picked=[...document.querySelectorAll('.drawer .pick input:checked')].map(i=>i.value);
      const s=((document.getElementById('aoSearch')||{}).value||'').trim().toUpperCase(); if (s) picked.push(s);
      if (!picked.length){ toast('Cochez au moins une commande, ou saisissez un numéro.'); return; }
      picked.forEach(n=>{ if (!a.cmds.includes(n)) a.cmds.push(n); }); close(); toast(picked.length+' commande(s) rattachée(s) à « '+a.nom+' ». Le CA réalisé est recalculé.'); break; }
    case 'note': st.drawer={kind:'note'}; break;
    case 'note-save': { const t=((document.getElementById('noteTxt')||{}).value||'').trim(); if (!t){ toast('La note est vide.'); return; }
      const nx=((document.getElementById('noteNext')||{}).value||'').trim();
      (NOTES[st.ens]=NOTES[st.ens]||[]).unshift({d:'17/11', who:ROLES[st.role].label, t: t + (nx?' Prochaine action : '+nx:'')}); close(); toast('Note enregistrée sur la fiche.'); break; }
    case 'valid': artBy(arg).statut='Validé'; artBy(arg).comp=Math.max(artBy(arg).comp,95); toast('Article validé. Il disparaît des tâches de la Qualité.'); break;
    case 'refus': artBy(arg).statut='Incomplet'; toast('Article renvoyé à l’ADV avec un motif (maquette).'); break;
    case 'demande': artBy(arg).statut='À valider'; toast('Demande de validation envoyée à la Qualité.'); break;
    case 'art-save': { const a=artBy(st.art); a.denom=st._denom||a.denom; st.dirty=false; toast('Bloc Identification enregistré.'); break; }
    case 'art-cancel': st.dirty=false; toast('Modifications annulées.'); break;
    case 'pres': { const cyc=['Bureau','Télétravail','Déplacement','Congé demandé']; const d=PRES[id]; d[1]=cyc[(cyc.indexOf(d[1])+1)%cyc.length];
      if (d[1]==='Congé demandé'){ CONGES.push({id:Date.now(), sal:'Moi', du:d[0].slice(4)+'/11', au:d[0].slice(4)+'/11', j:1, statut:'à valider'}); toast('Demande de congé envoyée à la RH.'); } break; }
    case 'cg-ok': CONGES.find(c=>c.id===id).statut='validé'; toast('Congés validés. Le salarié est prévenu.'); break;
    case 'cg-ko': CONGES.find(c=>c.id===id).statut='refusé'; toast('Congés refusés. Le salarié est prévenu.'); break;
  }
  render();
}

/* ═════════ Interactions ═════════ */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act],[data-go],[data-tab],[data-sub],[data-level],[data-fam],[data-stock],[data-ens],[data-art],[data-plan],[data-toast]'); if (!b) return;
  const has=s=>ROLES[st.role].spaces.includes(s);
  if (b.dataset.act){ e.preventDefault(); act(b.dataset.act); return; }
  if (st.dirty && (b.dataset.go||b.dataset.tab||b.dataset.sub||b.dataset.art)){ toast('Modifications non enregistrées : enregistrez ou annulez d’abord.'); return; }
  if (b.dataset.toast){ toast(b.dataset.toast); return; }
  if (b.dataset.ens){ if (!has('clients')){ toast('Votre rôle n’a pas accès aux fiches clients.'); return; } st.ens=b.dataset.ens; st.level='enseigne'; st.sub.fiche='synthese'; go('clients','fiche'); return; }
  if (b.dataset.art){ st.art=b.dataset.art; st.sub.art='ident'; go('produits','article'); return; }
  if (b.dataset.go){ if (!has(b.dataset.go)){ toast('Cet espace n’est pas ouvert pour votre rôle.'); return; } go(b.dataset.go, b.dataset.gotab||null); return; }
  if (b.dataset.tab){ const [s,k]=b.dataset.tab.split(':'); st.tab[s]=k; render(); return; }
  if (b.dataset.sub){ const [s,k]=b.dataset.sub.split(':'); st.sub[s]=k; render(); return; }
  if (b.dataset.level){ st.level=b.dataset.level; render(); return; }
  if (b.dataset.fam){ st.fam=b.dataset.fam; render(); return; }
  if (b.dataset.stock){ st.stockView=b.dataset.stock; render(); return; }
  if (b.dataset.plan){ st.planF=b.dataset.plan; render(); return; }
});
window.addEventListener('hashchange', ()=>{ st.drawer=null; st.dirty=false; render(); });
window.addEventListener('keydown', e=>{ if (e.key==='Escape' && st.drawer){ st.drawer=null; render(); } });

// Bouton « Faisabilité » : pastilles sur les onglets + bandeau explicatif
(function(){
  const btn=document.createElement('button'); btn.className='iconbtn'; btn.id='feasBtn'; btn.setAttribute('aria-pressed','false');
  btn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Faisabilité</span>';
  btn.addEventListener('click', ()=>{ st.feas=!st.feas; btn.setAttribute('aria-pressed', String(st.feas)); btn.classList.toggle('on', st.feas);
    toast(st.feas?'Faisabilité affichée : un point de couleur sur chaque onglet, le détail en haut de l’écran.':'Faisabilité masquée.'); render(); });
  const tb=document.getElementById('themeBtn'); tb.parentNode.insertBefore(btn, tb);
  const nb=document.createElement('button'); nb.className='iconbtn'; nb.id='notesBtn'; nb.setAttribute('aria-pressed','false'); nb.textContent='Notes de maquette';
  nb.addEventListener('click', ()=>{ st.notes=!st.notes; nb.setAttribute('aria-pressed', String(st.notes)); nb.classList.toggle('on', st.notes);
    toast(st.notes?'Notes de maquette affichées : ce qui change par rapport à l’app actuelle.':'Notes de maquette masquées.'); render(); });
  btn.parentNode.insertBefore(nb, btn);
})();

const roleSel=document.getElementById('roleSel');
roleSel.innerHTML=Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===st.role?'selected':''}>${r.label}</option>`).join('');
roleSel.addEventListener('change', e=>{
  st.role=e.target.value; try{ localStorage.setItem('yt-maquette-role', st.role); }catch(err){}
  const R=ROLES[st.role]; if (!R.spaces.includes(location.hash.slice(1))) location.hash=R.home; else render();
  toast('Vue de l’app pour le rôle '+R.label+' : '+R.spaces.length+' espace'+(R.spaces.length>1?'s':'')+'.');
});

function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); document.getElementById('themeLbl').textContent = t==='dark'?'Clair':'Sombre'; }
let theme='light'; try{ theme=localStorage.getItem('yt-maquette-theme-givre')||'light'; }catch(e){}
applyTheme(theme);
document.getElementById('themeBtn').addEventListener('click', ()=>{ theme=theme==='dark'?'light':'dark'; applyTheme(theme); try{ localStorage.setItem('yt-maquette-theme-givre',theme); }catch(e){} });

// Recherche globale : articles, clients, commandes, pages (via le plan)
const q=document.getElementById('q'), res=document.getElementById('results'); let selIdx=0, hits=[];
function searchAll(s){
  s=s.toLowerCase().trim(); if (!s) return [];
  const R=ROLES[st.role].spaces, out=[];
  if (R.includes('produits')||R.includes('logistique')) ARTICLES.forEach(a=>{ if ((a.code+' '+a.nom+' '+a.fam).toLowerCase().includes(s)) out.push({kind:'Article',label:a.nom,sub:a.code,art:a.code,ok:R.includes('produits')}); });
  if (R.includes('clients')) ENSEIGNES.forEach(x=>{ if ((x.nom+' '+x.groupe).toLowerCase().includes(s)) out.push({kind:'Client',label:x.nom,sub:x.groupe,ens:x.id}); });
  if (R.includes('ventes')) COMMANDES.forEach(c=>{ if ((c.num+' '+c.ref).toLowerCase().includes(s)) out.push({kind:'Commande',label:c.num,sub:c.ref,go:'ventes',tab:'commandes'}); });
  PLAN.forEach(([file,lbl,sp,tab,fate])=>{ if (fate!=='arch' && R.includes(sp) && (lbl+' '+file).toLowerCase().includes(s)) out.push({kind:'Page',label:lbl,sub:SPACES[sp].label,go:sp,tab}); });
  return out.slice(0,9);
}
function showResults(){
  hits=searchAll(q.value); if (!q.value.trim()){ res.hidden=true; return; } res.hidden=false;
  res.innerHTML = hits.length ? hits.map((h,i)=>`<button class="${i===selIdx?'sel':''}" data-i="${i}"><span class="kind">${h.kind}</span><span>${h.label}</span><span class="code">${h.sub}</span></button>`).join('')
    : `<div class="empty">Rien trouvé dans les espaces ouverts à votre rôle. Essayez « cône », « Altis », « CMD-26 » ou « pénalités ».</div>`;
}
function openHit(h){
  if (!h) return; res.hidden=true; q.value='';
  if (h.ens){ st.ens=h.ens; st.level='enseigne'; st.sub.fiche='synthese'; go('clients','fiche'); }
  else if (h.art){ if (h.ok){ st.art=h.art; st.sub.art='ident'; go('produits','article'); } else go('logistique','stock'); }
  else go(h.go, h.tab);
}
q.addEventListener('input', ()=>{ selIdx=0; showResults(); });
q.addEventListener('keydown', e=>{
  if (e.key==='ArrowDown'){ selIdx=Math.min(selIdx+1,hits.length-1); showResults(); e.preventDefault(); }
  else if (e.key==='ArrowUp'){ selIdx=Math.max(selIdx-1,0); showResults(); e.preventDefault(); }
  else if (e.key==='Enter'){ openHit(hits[selIdx]); }
  else if (e.key==='Escape'){ res.hidden=true; q.blur(); }
});
res.addEventListener('click', e=>{ const b=e.target.closest('[data-i]'); if (b) openHit(hits[+b.dataset.i]); });
document.addEventListener('click', e=>{ if (!e.target.closest('.search')) res.hidden=true; });
window.addEventListener('keydown', e=>{ if ((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); q.focus(); } });

render();
</script>
