<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yetigel ADV — Maquette espaces</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Sora:wght@300;400;500;600;700&display=swap">
<style>
/* Layout : coquille d'app — barre latérale d'espaces par métier + zone de travail à onglets.
   Design system Yetigel (CLAUDE.md) : sombre par défaut, accent cyan, DM Serif Display + Sora. */
:root{
  --bg:#060f1e; --surface:#0a1628; --elev:#0d1f35; --border:#1a3a55;
  --fg:#e3eef7; --muted:#89a3ba; --faint:#5d7a93;
  --accent:#00B4D8; --accent-ink:#04121f; --accent-soft:rgba(0,180,216,.14);
  --pos:#00e676; --neg:#ff6b6b; --warn:#ffd54f;
  --pos-soft:rgba(0,230,118,.13); --neg-soft:rgba(255,107,107,.14); --warn-soft:rgba(255,213,79,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-body:"Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f6f9; --surface:#ffffff; --elev:#e9f0f5; --border:#cfdce6;
    --fg:#0b1f33; --muted:#52687d; --faint:#7d93a6;
    --accent:#0089a6; --accent-ink:#ffffff; --accent-soft:rgba(0,137,166,.10);
    --pos:#0a8a4a; --neg:#c33a3a; --warn:#946400;
    --pos-soft:rgba(10,138,74,.10); --neg-soft:rgba(195,58,58,.10); --warn-soft:rgba(148,100,0,.12);
    --shadow:0 10px 30px rgba(11,31,51,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f6f9; --surface:#ffffff; --elev:#e9f0f5; --border:#cfdce6;
  --fg:#0b1f33; --muted:#52687d; --faint:#7d93a6;
  --accent:#0089a6; --accent-ink:#ffffff; --accent-soft:rgba(0,137,166,.10);
  --pos:#0a8a4a; --neg:#c33a3a; --warn:#946400;
  --pos-soft:rgba(10,138,74,.10); --neg-soft:rgba(195,58,58,.10); --warn-soft:rgba(148,100,0,.12);
  --shadow:0 10px 30px rgba(11,31,51,.10);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* ── Coquille ── */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 6px 16px;border-bottom:1px solid var(--border)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.01em}
.brand span{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px;overflow-y:auto}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);padding:10px 8px 4px}
.nav a{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  color:var(--muted);text-decoration:none;border:1px solid transparent}
.nav a:hover{background:var(--elev);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--fg);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.nav a.on svg{color:var(--accent)}
.nav a small{display:block;font-size:11px;color:var(--faint);line-height:1.3;margin-top:1px}
.nav .cnt{font-size:11px;font-weight:600;min-width:22px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--elev);color:var(--fg)}
.nav .cnt.hot{background:var(--neg-soft);color:var(--neg)}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding:14px 6px 0;display:flex;flex-direction:column;gap:8px}
.audit-note{font-size:11.5px;color:var(--muted);line-height:1.45}
.audit-note b{color:var(--fg);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.burger{display:none;background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:7px 9px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px 9px 36px;
  color:var(--fg);font:inherit}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 10px var(--f-body);color:var(--faint);
  border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:360px;overflow:auto}
.results button{display:grid;grid-template-columns:86px 1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:8px 10px;border-radius:8px;align-items:center}
.results button:hover,.results button.sel{background:var(--elev)}
.results .kind{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.results .empty{padding:12px;color:var(--muted);font-size:13px}
.role{display:flex;align-items:center;gap:8px}
.role label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
select{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font:inherit}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 10px;display:inline-flex;align-items:center;gap:6px}
.mock{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--warn);background:var(--warn-soft);
  border-radius:999px;padding:4px 10px;white-space:nowrap}

.page{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1320px;width:100%;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:600}
.head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.2vw,36px);line-height:1.1;margin-top:4px}
.head p{margin:6px 0 0;color:var(--muted);max-width:68ch}

.why{border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--border));border-radius:12px;background:var(--accent-soft)}
.why summary{cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:600;color:var(--fg);list-style:none;display:flex;gap:8px;align-items:center}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:13px}
.why[open] summary::before{content:"–"}
.why ul{margin:0;padding:0 16px 12px 40px;color:var(--muted);font-size:13px;display:grid;gap:4px}
.why b{color:var(--fg);font-weight:600}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:0}
.panel h2{font-size:13px;font-weight:600;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.panel h2 .link{font-size:12px;font-weight:500;color:var(--accent);background:none;border:0;padding:0}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--pos)} .down{color:var(--neg)}

/* À traiter */
.todo{display:flex;flex-direction:column}
.todo button{display:grid;grid-template-columns:4px 54px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--border);padding:12px 4px}
.todo button:last-child{border-bottom:0}
.todo button:hover{background:var(--elev)}
.todo .sev{align-self:stretch;border-radius:4px}
.sev.crit{background:var(--neg)} .sev.warn{background:var(--warn)} .sev.ok{background:var(--accent)}
.todo .n{font-family:var(--f-display);font-size:26px;line-height:1;text-align:right}
.todo .t{font-weight:500}
.todo .s{font-size:12px;color:var(--muted)}
.todo .go{font-size:12px;color:var(--accent);white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)} .chip.neg{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.mute{background:var(--elev);color:var(--muted)}
.locked{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);background:var(--elev);border:1px solid var(--border);
  border-radius:999px;padding:2px 9px}

.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;
  background:var(--elev);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--elev) 60%,transparent)}
td.r,th.r{text-align:right}
.code{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.bar{height:6px;border-radius:999px;background:var(--elev);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar i.w{background:var(--warn)} .bar i.c{background:var(--neg)} .bar i.p{background:var(--pos)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.seg{display:inline-flex;background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{background:none;border:0;border-radius:7px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.2)}

/* Fiche 360 */
.ident{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mono{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;
  background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--accent)}
.cascade{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.step{background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.step .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.step .v{font-size:18px;font-weight:600}
.step.total{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-soft)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}

/* Kanban finance */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.lane{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lane h3{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between}
.card{background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.card .a{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:500}
.card .b{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* Semaine présences */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:84px}
.day .dn{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.day.today{border-color:var(--accent)}

/* Terminal inventaire */
.phone{width:min(240px,100%);aspect-ratio:9/16;max-width:100%;border:1px solid var(--border);border-radius:24px;background:var(--bg);padding:16px 12px;
  display:flex;flex-direction:column;gap:10px;margin-inline:auto}
.phone .scan{border:2px dashed var(--accent);border-radius:12px;padding:16px 10px;text-align:center;color:var(--muted);font-size:12px}
.phone .big{font-family:var(--f-display);font-size:30px;text-align:center}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--border)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;max-width:min(360px,calc(100vw - 32px))}

@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .split{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:35;transform:translateX(-102%);transition:transform .2s ease;
    padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
  .side.open{transform:none}
  .burger{display:inline-flex}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .search kbd{display:none}
}
@media (max-width:520px){ .g4{grid-template-columns:minmax(0,1fr)} .week{grid-template-columns:repeat(2,minmax(0,1fr))} .mock{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side" aria-label="Espaces">
    <div class="brand"><b>Yetigel</b><span>ADV</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="audit-note" id="auditNote"></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Ouvrir le menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Chercher un article, une enseigne, une commande…" aria-label="Recherche globale">
        <kbd>Ctrl K</kbd>
        <div class="results" id="results" hidden></div>
      </div>
      <div class="role">
        <label for="roleSel">Vu par</label>
        <select id="roleSel"></select>
      </div>
      <button class="iconbtn" id="themeBtn" aria-label="Basculer clair / sombre">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span id="themeLbl">Clair</span>
      </button>
      <span class="mock">Maquette · données fictives</span>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ═════════ Données fictives (enseignes, produits et montants inventés) ═════════ */
const ICON = {
  accueil:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  clients:'<path d="M3 21V8l7-5 7 5v13"/><path d="M10 21v-5h4v5"/><path d="M17 12h4v9h-4"/>',
  ventes:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  produits:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
  logistique:'<rect x="2" y="6" width="13" height="11" rx="1"/><path d="M15 10h4l3 3v4h-7"/><circle cx="6.5" cy="18.5" r="1.8"/><circle cx="18" cy="18.5" r="1.8"/>',
  finance:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  terrain:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  direction:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  moi:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  admin:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'

function barChart(n, p, labels){
  const W=640,H=210,padL=40,padB=26,padT=10;
  const max = Math.ceil(Math.max(...n,...p)/50)*50;
  const cw=(W-padL-10)/n.length, bw=Math.min(14,cw/3);
  const y=v=>padT+(H-padT-padB)*(1-v/max);
  let g='';
  for(let t=0;t<=max;t+=max/4){ g+=`<line x1="${padL}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)" stroke-width="1"/><text x="${padL-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--faint)">${Math.round(t)}</text>`; }
  n.forEach((v,i)=>{ const x=padL+i*cw+cw/2;
    g+=`<rect x="${x-bw-1}" y="${y(p[i])}" width="${bw}" height="${y(0)-y(p[i])}" rx="2" fill="var(--border)"/>`;
    g+=`<rect x="${x+1}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="2" fill="var(--accent)"/>`;
    g+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${labels[i]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="CA mensuel N et N-1 en k€">${g}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>2026 (k€)</span><span><i style="background:var(--border)"></i>2025 (k€)</span></div>`;
}

     <section class="panel"><h2>Mon dossier RH</h2><div class="tbl"><table><thead><tr><th>Document</th><th>Date</th></tr></thead><tbody>
       <tr><td>Bulletin de paie · octobre 2026</td><td>31/10/2026</td></tr><tr><td>Attestation mutuelle</td><td>12/09/2026</td></tr><tr><td>Avenant télétravail</td><td>01/07/2026</td></tr>
     </tbody></table></div></section>`;

function vAdmin(){
  const rows=[['ADV','8','7 espaces','12 exceptions individuelles'],['Comptabilité','2','5 espaces','2 périmètres différents'],['Qualité','3','3 espaces','—'],['Logistique','2','4 espaces','—'],['Direction','1','5 espaces, lecture seule','—'],['Salarié','7','1 espace','5 comptes jamais connectés']];
  return head('Administration', 'Rôles et espaces', 'Un rôle donne un ensemble d’espaces. Les exceptions individuelles redeviennent rares.') +
    why(['Aujourd’hui, 171 exceptions individuelles. C’est ce qui produit des écrans à moitié autorisés.',
         'Les paramétrages (configuration des pénalités, mapping pays BV) et la Wishbox se rangent ici.']) +
    `<div class="tbl"><table><thead><tr><th>Rôle</th><th class="r">Comptes</th><th>Espaces</th><th>Remarque</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="r num">${r[1]}</td><td>${r[2]}</td><td class="code">${r[3]}</td></tr>`).join('')}</tbody></table></div>
    <div class="grid g3"><section class="panel"><h2>Paramètres pénalités</h2><p class="note" style="margin:0">Motifs, modèles de mail.</p></section><section class="panel"><h2>Mapping pays BV</h2><p class="note" style="margin:0">Correspondances pays et TVA.</p></section><section class="panel"><h2>Wishbox</h2><p class="note" style="margin:0">Ouverte à tous en dépôt, pour faire remonter les irritants.</p></section></div>`;
}

const VIEWS = {accueil:vAccueil, clients:vClients, ventes:vVentes, produits:vProduits, logistique:vLogistique, finance:vFinance, terrain:vTerrain, direction:vDirection, moi:vMoi, admin:vAdmin};

function render(){
  const cur = route();
  renderNav(cur);
  document.getElementById('page').innerHTML = VIEWS[cur]();
  document.getElementById('side').classList.remove('open');
  const es = document.getElementById('ensSel');
  if (es) es.addEventListener('change', e=>{ st.ens=e.target.value; render(); });
}

/* ═════════ Interactions ═════════ */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-go],[data-tab],[data-level],[data-fam],[data-stock],[data-ens],[data-toast]');
  if (!b) return;
  if (b.dataset.toast){ toast(b.dataset.toast); return; }
  if (b.dataset.ens){ st.ens=b.dataset.ens; st.level='enseigne'; st.tab.clients='synthese'; if (!ROLES[st.role].spaces.includes('clients')) { toast('Votre rôle n’a pas accès aux fiches clients.'); return; } go('clients'); return; }
  if (b.dataset.go){ if (!ROLES[st.role].spaces.includes(b.dataset.go)) { toast('Cet espace n’est pas ouvert pour votre rôle.'); return; } go(b.dataset.go); return; }
  if (b.dataset.tab){ const [s,k]=b.dataset.tab.split(':'); st.tab[s]=k; render(); return; }
  if (b.dataset.level){ st.level=b.dataset.level; render(); return; }
  if (b.dataset.fam){ st.fam=b.dataset.fam; render(); return; }
  if (b.dataset.stock){ st.stockView=b.dataset.stock; render(); return; }
});
window.addEventListener('hashchange', render);

const roleSel = document.getElementById('roleSel');
roleSel.innerHTML = Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===st.role?'selected':''}>${r.label}</option>`).join('');
roleSel.addEventListener('change', e=>{
  st.role = e.target.value;
  try { localStorage.setItem('yt-maquette-role', st.role); } catch(err){}
  const R = ROLES[st.role];
  if (!R.spaces.includes(location.hash.slice(1))) location.hash = R.home; else render();
  toast('Vue de l’app pour le rôle ' + R.label + ' : ' + R.spaces.length + ' espace' + (R.spaces.length>1?'s':'') + '.');
});

document.getElementById('burger').addEventListener('click', ()=>document.getElementById('side').classList.toggle('open'));

// Thème : sombre par défaut (charte Yetigel), bascule manuelle
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeLbl').textContent = t==='dark' ? 'Clair' : 'Sombre';
}
let theme = 'dark';
try { theme = localStorage.getItem('yt-maquette-theme') || 'dark'; } catch(e){}
applyTheme(theme);
document.getElementById('themeBtn').addEventListener('click', ()=>{
  theme = theme==='dark' ? 'light' : 'dark'; applyTheme(theme);
  try { localStorage.setItem('yt-maquette-theme', theme); } catch(e){}
});

// Recherche globale
const q = document.getElementById('q'), res = document.getElementById('results');
let selIdx = 0, hits = [];
function searchAll(s){
  s = s.toLowerCase().trim(); if (!s) return [];
  const R = ROLES[st.role].spaces;
  const out = [];
  if (R.includes('produits') || R.includes('logistique')) ARTICLES.forEach(a=>{ if ((a.code+' '+a.nom+' '+a.fam).toLowerCase().includes(s)) out.push({kind:'Article', label:a.nom, sub:a.code, go: R.includes('produits')?'produits':'logistique'}); });
  if (R.includes('clients')) ENSEIGNES.forEach(x=>{ if ((x.nom+' '+x.groupe).toLowerCase().includes(s)) out.push({kind:'Client', label:x.nom, sub:x.groupe, ens:x.id}); });
  if (R.includes('ventes')) COMMANDES.forEach(c=>{ if ((c.num+' '+c.ref).toLowerCase().includes(s)) out.push({kind:'Commande', label:c.num, sub:c.ref, go:'ventes', tab:'commandes'}); });
  return out.slice(0,8);
}
function showResults(){
  hits = searchAll(q.value);
  if (!q.value.trim()){ res.hidden = true; return; }
  res.hidden = false;
  res.innerHTML = hits.length ? hits.map((h,i)=>`<button class="${i===selIdx?'sel':''}" data-i="${i}"><span class="kind">${h.kind}</span><span>${h.label}</span><span class="code">${h.sub}</span></button>`).join('')
    : `<div class="empty">Rien trouvé dans les espaces ouverts à votre rôle. Essayez « cône », « Altis » ou « CMD-26 ».</div>`;
}
function openHit(h){
  if (!h) return; res.hidden = true; q.value = '';
  if (h.ens){ st.ens=h.ens; st.level='enseigne'; st.tab.clients='synthese'; go('clients'); }
  else { if (h.tab) st.tab[h.go]=h.tab; go(h.go); }
}
q.addEventListener('input', ()=>{ selIdx=0; showResults(); });
q.addEventListener('keydown', e=>{
  if (e.key==='ArrowDown'){ selIdx=Math.min(selIdx+1,hits.length-1); showResults(); e.preventDefault(); }
  else if (e.key==='ArrowUp'){ selIdx=Math.max(selIdx-1,0); showResults(); e.preventDefault(); }
  else if (e.key==='Enter'){ openHit(hits[selIdx]); }
  else if (e.key==='Escape'){ res.hidden=true; q.blur(); }
});
res.addEventListener('click', e=>{ const b=e.target.closest('[data-i]'); if (b) openHit(hits[+b.dataset.i]); });
document.addEventListener('click', e=>{ if (!e.target.closest('.search')) res.hidden = true; });
window.addEventListener('keydown', e=>{ if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); q.focus(); } });

render();
</script>
</body>
</html>
